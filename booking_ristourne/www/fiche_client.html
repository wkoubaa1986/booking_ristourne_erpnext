<script>
/* ---------- FLAG MOBILE (affichage uniquement) ---------- */
const IS_MOBILE = window.matchMedia("(max-width: 600px)").matches;

/* ---------- INIT / AUTH ---------- */

document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (!token) {
    alert("Session expirée. Veuillez vous reconnecter.");
    window.location.href = '/client_login';
    return;
  }

  fetch(`/api/method/booking_ristourne.ristourne.check_token_validity?token=${encodeURIComponent(token)}`)
    .then(r => r.json())
    .then(data => {
      if (!data.message || data.message.status !== 'valid') {
        alert("Session expirée. Veuillez vous reconnecter.");
        window.location.href = '/client_login';
      } else {
        const customer = data.message.customer_name;
        document.getElementById('page-title').textContent = `Fiche client – ${customer}`;

        loadInfoMessage(customer);

        // log connexion (optionnel)
        fetch(`/api/method/booking_ristourne.ristourne.log_customer_login?customer_name=${encodeURIComponent(customer)}`)
          .catch(()=>{});

        loadDashboard(token);
        loadPOSButton(customer, token);

        // ping régulier
        setInterval(() => {
          fetch(`/api/method/booking_ristourne.ristourne.check_token_validity?token=${encodeURIComponent(token)}`)
            .then(r => r.json())
            .then(d => {
              if (!d.message || d.message.status !== 'valid') {
                alert("Session expirée pendant votre session. Veuillez vous reconnecter.");
                window.location.href = '/client_login';
              }
            })
            .catch(() => {
              alert("Erreur de vérification. Déconnexion forcée.");
              window.location.href = '/client_login';
            });
        }, 2 * 60 * 1000);
      }
    })
    .catch(() => {
      alert("Erreur de vérification. Veuillez vous reconnecter.");
      window.location.href = '/client_login';
    });
});

function showTab(tabId) {
  document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`[onclick="showTab('${tabId}')"]`).classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

/* ---------- INFO MESSAGE ---------- */

function loadInfoMessage(customerName) {
  fetch(`/api/method/booking_ristourne.ristourne.get_info_message?customer_name=${encodeURIComponent(customerName)}`)
    .then(r => r.json())
    .then(data => {
      if (data.message && data.message.message) {
        document.getElementById('info-content').innerHTML = data.message.message;
      } else if (data.message) {
        document.getElementById('info-content').innerHTML = data.message;
      } else {
        document.getElementById('info-content').innerHTML = '<p>Erreur lors du chargement des informations personnalisées.</p>';
      }
      if (data.message && data.message.links_html) {
        document.getElementById('links-content').innerHTML = data.message.links_html;
      }
    })
    .catch(() => {
      document.getElementById('info-content').innerHTML = '<p>Erreur lors du chargement des informations personnalisées.</p>';
    });
}

/* ---------- BOUTON POS ---------- */

function loadPOSButton(customerName, token) {
  // Récupérer uniquement le profil POS au chargement (le SID sera récupéré au clic)
  fetch(`/api/method/booking_ristourne.ristourne.get_pos_profile_for_customer?customer_name=${encodeURIComponent(customerName)}`)
    .then(r => r.json())
    .then(profileData => {
      const profile = (profileData.message && profileData.message.pos_profile) || 'POS - Vente standard';
      const btnContainer = document.getElementById('pos-btn-container');
      if (!btnContainer) return;
      const url = `/app/point-of-sale?pos_profile=${encodeURIComponent(profile)}`;
      btnContainer.dataset.posUrl = url;
      btnContainer.dataset.posCustomer = customerName;
      btnContainer.dataset.posToken = token;
      btnContainer.dataset.posProfile = profile;
      btnContainer.innerHTML = `
        <button onclick="togglePOS(this)" class="pos-btn">
          🔍 Rechercher un article
        </button>`;
    }).catch(() => {});
}

function togglePOS(btn) {
  const iframeContainer = document.getElementById('pos-iframe-container');
  const btnContainer = document.getElementById('pos-btn-container');
  const url = btnContainer.dataset.posUrl;
  const customer = btnContainer.dataset.posCustomer;
  const token = btnContainer.dataset.posToken;
  const posProfile = decodeURIComponent(url.split('pos_profile=')[1] || '');

  if (iframeContainer.style.display === 'block') {
    iframeContainer.style.display = 'none';
    iframeContainer.innerHTML = '';
    btn.classList.remove('pos-btn-close');
    btn.textContent = '🔍 Rechercher un article';
    // Si la session catalogue.pos a été activée, la supprimer pour ne pas
    // interférer avec les sessions ERPNext des autres utilisateurs
    const userIdCookie = document.cookie.split(';').find(c => c.trim().startsWith('user_id='));
    if (userIdCookie && decodeURIComponent(userIdCookie.split('=')[1]) === 'catalogue.pos@aquaworld.com') {
      fetch('/api/method/frappe.auth.logout', { method: 'POST' }).catch(() => {});
    }
  } else {
    localStorage.setItem('pos_customer', customer);
    btn.disabled = true;
    btn.textContent = '⏳ Chargement...';

    // Vérifier d'abord si un utilisateur Frappe est déjà connecté (employé ERPNext)
    // Si oui : ne pas appeler get_catalogue_sid pour ne pas écraser sa session
    fetch('/api/method/frappe.auth.get_logged_user')
      .then(r => r.json())
      .then(userResp => {
        const currentUser = (userResp && userResp.message) || 'Guest';
        const isEmployee = currentUser !== 'Guest' && currentUser !== 'catalogue.pos@aquaworld.com';

        if (isEmployee) {
          // Utilisateur ERPNext connecté → utiliser sa propre session, pas de get_catalogue_sid
          // ensure_pos_opening_entry avec le CSRF token standard Frappe
          const csrfToken = frappe && frappe.csrf_token ? frappe.csrf_token : '';
          const formData = new FormData();
          formData.append('pos_profile', posProfile);
          const ensureHeaders = {};
          if (csrfToken) ensureHeaders['X-Frappe-CSRF-Token'] = csrfToken;
          return fetch(
            '/api/method/booking_ristourne.ristourne.ensure_pos_opening_entry',
            { method: 'POST', headers: ensureHeaders, body: formData }
          ).catch(() => {});
        } else {
          // Client public (Guest) ou catalogue.pos → obtenir un SID catalogue frais
          return fetch(`/api/method/booking_ristourne.ristourne.get_catalogue_sid?token=${encodeURIComponent(token)}`)
            .then(r => r.json())
            .then(sidData => {
              const csrfToken = (sidData.message && sidData.message.csrf_token) || '';
              const formData = new FormData();
              formData.append('pos_profile', posProfile);
              const ensureHeaders = {};
              if (csrfToken) ensureHeaders['X-Frappe-CSRF-Token'] = csrfToken;
              return fetch(
                '/api/method/booking_ristourne.ristourne.ensure_pos_opening_entry',
                { method: 'POST', headers: ensureHeaders, body: formData }
              ).catch(() => {});
            });
        }
      })
      .catch(() => {})
      .finally(() => {
        btn.disabled = false;

        // Overlay gris "Chargement..." affiché pendant que l'iframe se charge
        iframeContainer.innerHTML = `
          <div id="pos-header-bar" style="
            display:flex; align-items:center; background:#2d3748;
            padding:8px 16px; border-radius:8px 8px 0 0; gap:10px;">
            <span style="color:#a0aec0; font-size:12px;">Point de vente :</span>
            <span style="color:#fff; font-weight:bold; font-size:14px;">${posProfile}</span>
          </div>
          <div id="pos-loader" style="
            display:flex; align-items:center; justify-content:center;
            min-height:420px; background:#f4f4f4; border-radius:0 0 8px 8px;
            flex-direction:column; gap:14px;">
            <div style="width:48px;height:48px;border:5px solid #ccc;border-top-color:#4c9be8;
              border-radius:50%;animation:pos-spin 0.8s linear infinite;"></div>
            <span style="color:#888;font-size:1rem;">Chargement du catalogue...</span>
          </div>
          <style>@keyframes pos-spin{to{transform:rotate(360deg)}}</style>`;
        iframeContainer.style.display = 'block';
        iframeContainer.scrollIntoView({behavior: 'smooth', block: 'start'});

        const iframe = document.createElement('iframe');
        iframe.id = 'pos-iframe';
        iframe.allowFullscreen = true;
        iframe.style.display = 'none'; // caché jusqu'au chargement complet

        // CSS injecté dans l'iframe après chargement
        const posCSS = `
          header.navbar { display: none !important; }
          body { padding-top: 0 !important; }
          .item-qty-pill { display: none !important; }
          .customer-section { display: none !important; }
          .menu-btn-group { display: none !important; }
          .page-head { display: none !important; }
          .checkout-btn { display: none !important; }
          .add-discount-wrapper { display: none !important; }
          .uom-control { display: none !important; }
          .conversion_factor-control { display: none !important; }
          .actual_qty-control { display: none !important; }
          .price_list_rate-control { display: none !important; }
          .warehouse-control { display: none !important; }
          .discount_percentage-control { display: none !important; }
          .cart-totals-section > .net-total-container { display: flex !important; justify-content: space-between !important; }
          .cart-totals-section > .taxes-container { display: flex !important; flex-direction: column !important; }
        `;

        // JS injecté dans l'iframe : champ "Remise" calculé vs prix "Vente standard"
        const posJS = `(function() {
          var PRICE_LIST = "Vente standard";
          var _lastItemCode = null;

          function ensureRemiseBlock() {
            var rateCtrl = document.querySelector('.rate-control');
            if (!rateCtrl) return null;
            var block = document.getElementById('_custom_remise_block');
            if (!block) {
              block = document.createElement('div');
              block.id = '_custom_remise_block';
              block.style.cssText = 'margin-top:10px;padding:8px 14px;background:#f0fdf4;border-radius:8px;font-size:13px;color:#166534;font-weight:500;';
              block.innerHTML = '<span>Remise : </span><span id="_custom_remise_val" style="font-weight:700;">...</span>';
              rateCtrl.parentNode.insertBefore(block, rateCtrl.nextSibling);
            }
            return block;
          }

          function checkAndUpdate() {
            var pos = window.cur_pos;
            if (!pos || !pos.item_details) return;
            var container = document.querySelector('.item-details-container');
            if (!container) return;
            // Check if visible
            var style = window.getComputedStyle(container);
            if (style.display === 'none' || style.visibility === 'hidden') {
              _lastItemCode = null;
              return;
            }
            var item_row = pos.item_details.item_row;
            if (!item_row || !item_row.item_code) return;
            var item_code = item_row.item_code;
            var currentRate = parseFloat(item_row.rate) || parseFloat(item_row.price_list_rate) || 0;

            var block = ensureRemiseBlock();
            if (!block) return;
            var valEl = document.getElementById('_custom_remise_val');

            if (item_code === _lastItemCode) return;
            _lastItemCode = item_code;
            if (valEl) valEl.textContent = '...';

            window.frappe.call({
              method: "frappe.client.get_list",
              args: {
                doctype: "Item Price",
                filters: [["item_code","=",item_code],["price_list","=",PRICE_LIST],["selling","=",1]],
                fields: ["price_list_rate"],
                limit: 1
              },
              freeze: false,
              callback: function(r) {
                var b = document.getElementById('_custom_remise_block');
                var v = document.getElementById('_custom_remise_val');
                if (!b || !v) return;
                var rows = r && r.message;
                if (!rows || !rows.length) {
                  v.textContent = 'Non disponible';
                  b.style.background = '#fef9c3'; b.style.color = '#92400e';
                  return;
                }
                var stdPrice = parseFloat(rows[0].price_list_rate) || 0;
                if (stdPrice <= 0) { v.textContent = 'Non disponible'; return; }
                var pct = Math.max(0, (stdPrice - currentRate) / stdPrice * 100);
                b.style.background = pct > 0 ? '#f0fdf4' : '#f1f5f9';
                b.style.color = pct > 0 ? '#166534' : '#475569';
                v.textContent = pct.toFixed(1) + "% (Prix vente standard : " + stdPrice.toFixed(3) + " \u062f.\u062a)";
              }
            });
          }

          // Override page_length pour afficher plus d'articles (200 au lieu de 40)
          var _pageLengthPatched = false;
          function patchPageLength() {
            var pos = window.cur_pos;
            if (!pos || !pos.item_selector || _pageLengthPatched) return;
            var orig = pos.item_selector.get_items.bind(pos.item_selector);
            pos.item_selector.get_items = function(opts) {
              opts = opts || {};
              if (!opts.page_length) opts.page_length = 200;
              return orig(opts);
            };
            _pageLengthPatched = true;
            // Recharger la liste avec le nouveau page_length
            pos.item_selector.filter_items();
          }

          // Polling 400ms : Remise + force-show Total HT/TVA + page_length patch
          setInterval(function() {
            checkAndUpdate();
            patchPageLength();
            var netCont = document.querySelector('.net-total-container');
            if (netCont) netCont.style.setProperty('display', 'flex', 'important');
            var taxCont = document.querySelector('.taxes-container');
            if (taxCont && taxCont.children.length > 0) taxCont.style.setProperty('display', 'flex', 'important');
          }, 400);
        })();`;

        iframe.addEventListener('load', function() {
          // Injecter le CSS de masquage
          try {
            const doc = this.contentDocument || this.contentWindow.document;
            const win = this.contentWindow;
            if (doc && doc.head) {
              const style = doc.createElement('style');
              style.textContent = posCSS;
              doc.head.appendChild(style);
              // Injecter le JS "Remise" après que le POS soit initialisé
              const script = doc.createElement('script');
              script.textContent = posJS;
              doc.head.appendChild(script);
            }
          } catch(e) {}
          // Remplacer le loader par l'iframe
          const loader = document.getElementById('pos-loader');
          if (loader) loader.remove();
          this.style.display = 'block';
        });

        iframeContainer.appendChild(iframe);
        iframe.src = url; // déclenche le chargement APRÈS avoir attaché le listener
        btn.classList.add('pos-btn-close');
        btn.textContent = '✕ Fermer le catalogue';
      });
  }
}

/* ---------- DASHBOARD (TOTAL VENTES / RISTOURNE) ---------- */
const N = new Date().getFullYear();
const N1 = N + 1;
function loadDashboard(token) {
  fetch(`/api/method/booking_ristourne.ristourne.generate_ristourne_report_with_token?token=${encodeURIComponent(token)}`)
    .then(r => r.json())
    .then(data => {
      const r = data.message;
      if (!r) { alert('Aucune donnée retournée.'); return; }

      if (r.has_ristourne) {
        document.getElementById('summary').innerHTML =
          `<h3>Total HT ${N} : ${r.total_ht.toFixed(2)} TND | Ristourne Calculée ${N} (utilisable ${N1}) : ${r.ristourne.toFixed(2)} TND</h3>`;
      } else {
        document.getElementById('summary').innerHTML =
          `<h3>Total HT : ${r.total_ht.toFixed(2)} TND</h3><p style="color:#888;">Aucune ristourne définie pour vous actuellement.</p>`;
      }

      const labels = Object.keys(r.monthly_sales);
      const values = Object.values(r.monthly_sales);
      labels.push("TOTAL"); values.push(r.total_ht);

      const ctx = document.getElementById('ristourneChart').getContext('2d');
      if (window.salesChartInstance) window.salesChartInstance.destroy();
      window.salesChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Total des ventes livrées HT (TND)',
            data: values,
            backgroundColor: labels.map(l => l==="TOTAL" ? 'rgba(255,159,64,.7)':'rgba(75,192,192,.7)')
          }]
        },
        options: {
          responsive:true,
          scales:{
            y:{ beginAtZero:true },
            x:{
              ticks:{
                maxRotation: IS_MOBILE ? 60 : 0,
                minRotation: IS_MOBILE ? 45 : 0
              }
            }
          },
          plugins:{
            legend:{
              position: IS_MOBILE ? 'bottom' : 'top'
            }
          }
        }
      });

      // ---- TABLEAU DES PALIERS (restauré, rendu mobile friendly) ----
      if (r.has_ristourne && r.paliers && r.paliers.length > 0) {
        let html = `
          <h3>Détails des Paliers</h3>
          <div class="table-wrapper">
          <table>
            <tr>
              <th>Min (TND)</th>
              <th>Max (TND)</th>
              <th>% Réduction</th>
              <th>Montant HT Appliqué (TND)</th>
              <th>Ristourne Appliquée (TND)</th>
            </tr>`;
        r.paliers.forEach(p => {
          html += `<tr>
            <td>${p.palier_minimum.toFixed(2)}</td>
            <td>${p.palier_maximum ? p.palier_maximum.toFixed(2) : '∞'}</td>
            <td>${p.pourcentage.toFixed(2)}%</td>
            <td>${p.montant_applique_ht.toFixed(2)}</td>
            <td>${p.montant_ristourne.toFixed(2)}</td>
          </tr>`;
        });
        html += `<tr style="font-weight:bold;background:#f0f0f0;">
          <td colspan="3">TOTAL</td>
          <td>${r.total_ht.toFixed(2)}</td>
          <td>${r.ristourne.toFixed(2)}</td>
        </tr>`;
        html += `</table></div>`;
        document.getElementById('paliers_table').innerHTML = html;
      } else {
        document.getElementById('paliers_table').innerHTML =
          `<p style="color:#888;">Aucune ristourne configurée pour vous. Votre CA total est : <strong>${r.total_ht.toFixed(2)} TND</strong>.</p>`;
      }

      // Après avoir chargé le résumé, charger les groupes
      fetchGroupQuantities(token);
    })
    .catch(err => alert('Erreur lors de la récupération des données : ' + err.message));
}

/* ---------- INTERACTIVE GROUP VIEW ---------- */

// état global pour l'onglet "Quantité par Groupe"
let groupData = null;
let mainFamilies = [];
let selectedFamily = null;

// adapter si ton groupe racine a un autre nom
const ROOT_ITEM_GROUP = "Tous les Groupes d'Articles";

function fetchGroupQuantities(token) {
  fetch(`/api/method/booking_ristourne.ristourne.get_grouped_article_quantities_by_month_with_token?token=${encodeURIComponent(token)}`)
    .then(r => r.json())
    .then(data => {
      const r = data.message;
      if (!r) { alert('Aucune donnée retournée pour les groupes.'); return; }

      groupData = r;

      // familles principales = enfants directs du groupe racine
      mainFamilies = groupData.groups.filter(
        g => g.parent_item_group === ROOT_ITEM_GROUP
      );

      if (!mainFamilies.length) {
        console.warn("Aucune famille principale trouvée pour", ROOT_ITEM_GROUP);
        return;
      }

      // par défaut : première famille
      if (!selectedFamily) {
        selectedFamily = mainFamilies[0].item_group;
      }

      renderGroupFamilyButtons();
      renderGroupFamily();
    })
    .catch(err => alert('Erreur lors de la récupération des données groupes : ' + err.message));
}

// Affiche les boutons pour changer de famille
function renderGroupFamilyButtons() {
  const navContainer = document.getElementById('group-navigation');
  navContainer.innerHTML = "";

  const info = document.createElement('p');
  info.className = "group-nav-text";
  info.textContent = "Choisissez une famille pour voir le détail par sous-groupe :";
  navContainer.appendChild(info);

  const btnWrap = document.createElement('div');
  btnWrap.className = "group-nav";

  mainFamilies.forEach(f => {
    const btn = document.createElement('button');
    btn.textContent = f.item_group;
    btn.className = "group-btn" + (f.item_group === selectedFamily ? " active" : "");
    btn.addEventListener('click', () => {
      selectedFamily = f.item_group;
      renderGroupFamily();
      renderGroupFamilyButtons();
    });
    btnWrap.appendChild(btn);
  });

  navContainer.appendChild(btnWrap);
}

// Affiche le graphique + tableau pour la famille sélectionnée
function renderGroupFamily() {
  if (!groupData || !selectedFamily) return;

  const months = groupData.months;            // ex: ["2025-01", ..., "Moyenne"]
  const chartMonths = months.slice(0, -1);    // on retire "Moyenne" pour le graphe
  const groups = groupData.groups;

  const family = groups.find(g => g.item_group === selectedFamily);
  if (!family) {
    console.warn("Famille sélectionnée introuvable:", selectedFamily);
    return;
  }

  // sous-groupes = enfants directs de la famille sélectionnée
  let children = groups.filter(
    g => g.parent_item_group === selectedFamily
  );

  // si aucun enfant, on affiche simplement la famille elle-même
  const groupsToShow = children.length ? children : [family];

  // mettre à jour le titre
  document.getElementById('group-title').textContent =
    "Quantité par Groupe d'Articles – " + selectedFamily;

  // ====== GRAPHIQUE ======
  const gctx = document.getElementById('groupChart').getContext('2d');
  if (window.groupChartInstance) window.groupChartInstance.destroy();

  const datasets = groupsToShow.map(g => ({
    label: g.item_group,
    data: g.quantities.slice(0, -1),   // sans la moyenne pour le graphe
    backgroundColor: randomColor()
  }));

  window.groupChartInstance = new Chart(gctx, {
    type: 'bar',
    data: {
      labels: chartMonths,
      datasets
    },
    options: {
      responsive:true,
      scales:{
        x:{
          stacked:true,
          ticks:{
            maxRotation: IS_MOBILE ? 60 : 0,
            minRotation: IS_MOBILE ? 45 : 0
          }
        },
        y:{ stacked:true, beginAtZero:true }
      },
      plugins:{
        legend:{
          position: IS_MOBILE ? 'bottom' : 'top'
        }
      }
    }
  });

  // ====== TABLEAU ======
  let html = `<h3>Détails Quantité – ${selectedFamily}</h3>`;
  html += `<div class="table-wrapper"><table><tr><th>Groupe</th>${months.map(m=>`<th>${m}</th>`).join('')}</tr>`;

  // si on a des sous-groupes, ajouter une ligne total pour la famille
  if (children.length) {
    html += `<tr style="font-weight:bold;background:#fafafa;">
      <td>Total ${family.item_group}</td>
      ${family.quantities.map(q=>`<td>${q}</td>`).join('')}
    </tr>`;
  }

  groupsToShow.forEach(g => {
    html += `<tr>
      <td>${g.item_group}</td>
      ${g.quantities.map(q=>`<td>${q}</td>`).join('')}
    </tr>`;
  });

  html += '</table></div>';
  document.getElementById('group_table').innerHTML = html;
}

/* ---------- UTILS ---------- */

function randomColor(){
  const r=Math.floor(Math.random()*200),
        g=Math.floor(Math.random()*200),
        b=Math.floor(Math.random()*200);
  return `rgba(${r},${g},${b},0.7)`;
}
